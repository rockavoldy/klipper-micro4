[include mainsail.cfg]
[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E66430A64B2F9A24-if00
restart_method: command

#####################################################################
#      Temperature monitoring
#####################################################################
[temperature_sensor Micro4]
sensor_type: temperature_mcu

#####################################################################
#      Tmodel and acceleration
#####################################################################
[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000
max_z_velocity: 15
max_z_accel: 250
square_corner_velocity: 6.0

#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]
step_pin: gpio6
dir_pin:gpio3
enable_pin:!gpio7
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: 0
position_min: 0
position_max: 190
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_x]
uart_pin:gpio9
uart_address:0
interpolate: False
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^gpio13
driver_SGTHRS: 60

[stepper_y]
step_pin: gpio26
dir_pin:gpio25
enable_pin: !gpio27
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_endstop: 0
position_min: -5
position_max: 180
homing_speed: 20
homing_retract_dist: 0

[tmc2209 stepper_y]
uart_pin:gpio9
uart_address:2
interpolate: False
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
diag_pin: ^gpio15
driver_SGTHRS: 65

#####################################################################
#   Z Stepper Settings
#####################################################################
[stepper_z]
step_pin: gpio1
dir_pin: !gpio0
enable_pin:!gpio2
rotation_distance: 8
microsteps: 32
# endstop_pin: ^!gpio14
endstop_pin: probe:z_virtual_endstop
position_max: 180
# position_min: 0
position_min: -2
homing_speed: 20
second_homing_speed: 3.0
homing_retract_dist: 3.0

[tmc2209 stepper_z]
uart_pin:gpio9
uart_address:1
interpolate: False
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
#   Extruder
#####################################################################
[extruder]
sensor_type: Generic 3950
sensor_pin: gpio28
step_pin: gpio23
dir_pin: gpio22
enable_pin: !gpio24
microsteps: 16
rotation_distance: 22.6789511
gear_ratio:50:17
microsteps:16
full_steps_per_rotation: 200    
nozzle_diameter:0.400
filament_diameter:1.75
heater_pin: gpio20
min_temp: -50
max_temp: 300
max_power: 1.0
min_extrude_temp: 150
pressure_advance: 0.03
##Pressure in advance
##https://www.klipper3d.org/zh/Pressure_Advance.html
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 800
max_extrude_cross_section:800
control:watermark
step_pulse_duration: 0.000004

[tmc2209 extruder]
uart_pin:gpio9
uart_address:3
interpolate: False
run_current: 0.6
hold_current: 0.4
stealthchop_threshold: 0
sense_resistor: 0.110


#####################################################################
#   Bed Heater
#####################################################################
[heater_bed]
heater_pin: gpio21
sensor_type:Generic 3950
sensor_pin: gpio29
smooth_time: 3.0
# max_power: 0.6 # Only needed for 100w pads
min_temp: -50
max_temp: 120
control:watermark

#####################################################################
# Fan Control
#####################################################################
[fan]
pin: gpio17
max_power: 1.0
kick_start_time: 0.4
off_below: 0.13
cycle_time: 0.010
#####################################################################
[heater_fan hotend_fan]
pin: gpio16
max_power: 1.0
fan_speed: 1.0
kick_start_time: 0.4
heater: extruder
heater_temp: 50.0

#####################################################################
# Homing and Gantry Adjustment Routines
#####################################################################
[idle_timeout]
timeout: 1800

[bltouch]
sensor_pin: ^gpio18
control_pin: gpio19
x_offset: 16.65
y_offset: -39.65
speed: 5
samples: 2
probe_with_touch_mode: False

[screws_tilt_adjust]
screw1: 0, 65
screw2: 145, 65
screw3: 0, 180
screw4: 145, 180
horizontal_move_z: 5
speed: 100
screw_thread: CW-M3

[bed_mesh]
speed: 300
horizontal_move_z: 5

mesh_min: 20, 20
mesh_max: 160, 140

probe_count: 4,4
algorithm: bicubic
fade_start: 1
fade_end: 5
fade_target: 0



[exclude_object]
[respond]
[pause_resume]
[gcode_arcs]

[homing_override]
axes: xyz
gcode:
    _ARM_SENSORLESS
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    
    {% if home_all or 'X' in params %}
        _HOME_X
    {% endif %}
    
    {% if home_all or 'Y' in params %}
        _HOME_Y
    {% endif %}
    
    {% if home_all or 'Z' in params %}
        HOME_CENTER
        _HOME_Z
    {% endif %}
    _DISARM_SENSORLESS


#####################################################################
# Macros
#####################################################################

[gcode_macro PROBE_MESH]
gcode:
    M104 S120
    M140 S70

    G28
    BED_MESH_CALIBRATE PROFILE=default METHOD=automatic

    # Turn off heaters
    M104 S0
    M140 S0

    # Turn off fan
    M107

    # Disable motors (optional)
    M84

[gcode_macro HOME_CENTER]
gcode:
    G1 X90 Y90 F6000

[gcode_macro _PRIME_LINE]
gcode:
    G0 X187 Y110 F9000
    G0 Z0.2                 ; slightly higher for sticky PETG
    G92 E0
    G1 Y90 E8 F500          ; proportional purge, not a blob
    G92 E0
    G1 E-1 F1800            ; more retract so it doesn't string across
    G1 X80 F4000       ; wipe + lift in one move
    G1 Z0.3
    G92 E0


[gcode_macro PRINT_START]
description: Start print sequence
gcode:
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}
    M140 S{BED_TEMP}
    M104 S150               ; standby temp, no ooze during home/mesh
    G28
    M190 S{BED_TEMP}        ; wait for bed
    # optional heat soak if you probe live (not needed if loading a saved mesh):
    # G4 P120000            ; 2 min soak for plate to fully expand
    G90
    G1 X90 Y90 Z10 F6000
    BED_MESH_PROFILE LOAD=default   ; ensure this was saved at PETG bed temp!
    M109 S{EXTRUDER_TEMP}   ; final heat only after mesh/positioning
    M107                    ; fan off for PETG first layer
    _PRIME_LINE


[gcode_macro _ARM_SENSORLESS]
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE=60
    SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE=65

[gcode_macro _DISARM_SENSORLESS]
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=SGTHRS VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=SGTHRS VALUE=0


[gcode_macro PRINT_END]
description: End print sequence
gcode:
    # Stop extrusion cleanly
    G92 E0
    G1 E-3 F1800

    # Lift Z slightly
    G91
    G1 Z10 F2000
    G90

    # Move to rear park position (safe for your offsets)
    G1 X189 Y180 F6000

    # Turn off heaters
    M104 S0
    M140 S0

    # Turn off fan
    M107

    # Disable motors (optional)
    M84

    # Clear bed mesh to make sure next print arm works
    BED_MESH_CLEAR


[gcode_macro LOAD_FILAMENT]
gcode:
  M83                            ; set extruder to relative
  G1 E30 F300                    ; load
  G1 E15 F150                    ; prime nozzle with filament
  M82                            ; set extruder to absolute
    
[gcode_macro UNLOAD_FILAMENT]
gcode:
  M83                            ; set extruder to relative
  G1 E10 F300                    ; extrude a little to soften tip
  G1 E-40 F1800                  ; retract some, but not too much or it will jam
  M82                            ; set extruder to absolute

[gcode_macro _HOME_X]
gcode:
    # Home
    G28 X0
    # Move away
    G91
    G1 X10 F1200
    
    # wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    G90

[gcode_macro _HOME_Y]
gcode:
    # Home
    G28 Y0
    # Move away
    G91
    G1 Y10 F1200
    
    # wait just a second… (give StallGuard registers time to clear)
    G4 P1000
    G90

[gcode_macro _HOME_Z]
gcode:
    G90
    G28 Z
    G1 Z30

